name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Preparar archivo para cliente
        run: |
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/MDS_Oficio_Mexico.apk
          cp INSTRUCCIONES_CLIENTE.txt entrega/INSTRUCCIONES_CLIENTE.txt

      - name: Subir APK para cliente
        uses: actions/upload-artifact@v4
        with:
          name: MDS-Oficio-Mexico-APK
          path: entrega/
